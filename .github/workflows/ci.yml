# Her push ve pull request'te: derleme, gerçek Postgres'e karşı testler, eksik migration kontrolü
# ve Docker imajının derlenebildiği.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Derleme ve testler
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Testler bu sunucuda her çalıştırmada geçici bir veritabanı açıp siler
      HAPPYDAY_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Paketleri ve araçları geri yükle
        run: |
          dotnet restore HappyDay.sln
          dotnet tool restore

      - name: Derle
        run: dotnet build HappyDay.sln --no-restore -c Release

      - name: Testler
        run: dotnet test HappyDay.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Test sonuçlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      # Entity'de yapılıp migration'ı unutulan değişiklik burada yakalanır
      - name: Eksik migration kontrolü
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes -p Infrastructure/HappyDay.Persistance -s Presentation/HappyDay.Api --no-build -c Release

  docker:
    name: Docker imajı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İmajı derle (yayınlamadan)
        run: docker build -f Dockerfile -t happyday-api:ci .
