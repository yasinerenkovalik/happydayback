# Yerel geliştirme veritabanı.
#   docker compose -f docker-compose.dev.yml up -d
# Bağlantı bilgileri appsettings.Development.json ile aynıdır.
services:
  db:
    image: postgres:17-alpine
    container_name: happyday-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HappyDayDb
    ports:
      - "5432:5432"
    volumes:
      - happyday-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HappyDayDb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  happyday-pgdata:
